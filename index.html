<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Monster Statblock Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="controls">
        <div class="header-row">
            <div class="auth-area">
                <button id="login-btn">Sign in with Google</button>
                <div id="user-info" style="display:none;">
                    <span id="user-name"></span>
                    <button id="logout-btn">Sign Out</button>
                </div>
            </div>
            <div class="upload-area">
                <label for="json-upload" class="upload-btn">Upload JSON</label>
                <input type="file" id="json-upload" accept=".json" />
                <button id="export-template-btn" class="template-btn">Export Template</button>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="saved-monsters" id="saved-monsters" style="display:none;">
            <div class="sidebar-header" onclick="toggleSidebar()">
                <h2>Saved Monsters</h2>
                <span class="sidebar-toggle" id="sidebar-toggle">▼</span>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <button id="new-group-btn" class="new-group-btn">+ New Group</button>
                <div id="monster-list"></div>
            </div>
        </div>
        <div id="stat-block-container"></div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <p id="modal-message"></p>
            <div id="modal-buttons" class="modal-btn-row"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
