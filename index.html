<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Monster Statblock Generator</title>
    <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="controls">
        <div class="header-row">
            <div class="auth-area">
                <button id="login-btn">Sign In</button>
                <div id="user-info" style="display:none;">
                    <span id="user-name"></span>
                    <button id="logout-btn">Sign Out</button>
                </div>
            </div>
            <div class="upload-area">
                <label for="json-upload" class="upload-btn">Upload JSON</label>
                <input type="file" id="json-upload" accept=".json" multiple />
                <button id="export-template-btn" class="template-btn">Export Template</button>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="saved-monsters" id="saved-monsters" style="display:none;">
            <div class="sidebar-header" onclick="toggleSidebar()">
                <h2>Saved Monsters</h2>
                <span class="sidebar-toggle" id="sidebar-toggle">▼</span>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <div class="sidebar-top-row">
                    <button id="new-group-btn" class="new-group-btn">+ New Group</button>
                    <button onclick="toggleSelectMode()" class="select-mode-toggle-btn" id="select-mode-toggle" title="Select monsters for bulk delete">Select</button>
                </div>
                <div id="monster-list"></div>
            </div>
        </div>
        <div id="stat-block-container"></div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <p id="modal-message"></p>
            <div id="modal-buttons" class="modal-btn-row"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <p style="font-weight:bold;font-size:16px;margin-bottom:8px;">Sign In</p>
            <input id="login-username" type="text" placeholder="Username" autocomplete="username"
                style="width:100%;box-sizing:border-box;margin:6px 0;padding:8px 10px;font-size:15px;border:1px solid #ccc;border-radius:6px;" />
            <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"
                style="width:100%;box-sizing:border-box;margin:6px 0;padding:8px 10px;font-size:15px;border:1px solid #ccc;border-radius:6px;" />
            <p id="login-error" style="color:#c0392b;min-height:16px;margin:4px 0 8px;font-size:13px;"></p>
            <div class="modal-btn-row">
                <button class="modal-btn modal-btn-cancel" id="login-cancel">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="login-submit">Sign In</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.2/dist/pocketbase.umd.js"></script>
    <script>document.write('<script src="pb-compat.js?v=' + Date.now() + '"><\/script>');</script>
    <script>document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
